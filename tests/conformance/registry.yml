- command: predict
  level: E3
  tolerance: 1.0e-9
  sources:
    - type: r_crosscheck
      ref: "predict xb/residuals after regress mpg weight foreign; predict pr/xb after logit; predict e(2,.)/ystar(2,.) after tobit, all captured from StataNow 19.5"
  verified_by: lead
  date: 2026-10-23
  notes: "xb 1.6e-15, residuals 5.1e-13 (OLS); pr 3.1e-11, xb 3.6e-10 (logit); e(a,b) and ystar(a,b) both 5.8e-10 (tobit). Two real defects fixed here: (1) the tobit e(a,b) and ystar(a,b) implementations were swapped; (2) e(a,b) overflowed for observations whose linear index was far inside the interval, because 1-Phi(z) rounds to 0 for z>7. [R] tobit postestimation defines e(a,b)=E(y|a<y<b) (conditional) and ystar(a,b)=E(y*) with y*=max{a,min{y,b}} (unconditional)."

