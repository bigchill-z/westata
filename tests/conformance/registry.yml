- command: arch
  level: E2
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "arch r, arch(1) garch(1) on 800 observations: Stata b [mu -0.040745987731, alpha 0.116921861394, beta 0.780018069780, omega 0.081835127984]; westata gaps 4.7e-04, 1.2e-03, 2.8e-03, 1.5e-03"
    - type: r_crosscheck
      ref: "same fit, standard errors: Stata [0.029336114, 0.037699677, 0.079961894, 0.041705752]; westata gaps 9.2e-05, 9.8e-03, 3.4e-02, 1.6e-02"
  verified_by: lead
  date: 2026-10-23
  notes: "Stays E2, and the previous explanation here was WRONG. It said 'Stata's default is the OPG standard errors, whereas ours come from the Hessian; the optimisers also differ'. That cannot be the whole story, because an OPG-versus-Hessian difference moves the STANDARD ERRORS while leaving the point estimates at their optimum -- and the point estimates differ too (4.7e-04 to 2.8e-03). So the two optimisers are converging to different maxima of slightly different objective functions, not evaluating the same optimum with different curvature formulas. MEASURED STATE: coefficients agree to 1e-3, standard errors disagree by up to 40% (beta's SE is 0.0462 against 0.0800). Reaching parity needs the GARCH likelihood and its numerical derivatives reimplemented to match Stata's, which is substantial work rather than a tolerance adjustment, so the E2 stands with the numbers recorded. Also recorded: Stata's parameter names are equation-qualified (r:_cons, ARCH:L.arch, ARCH:L.garch, ARCH:_cons) while westata reports mu, alpha[1], beta[1], omega -- a naming difference that has to be reconciled before any value comparison, and did produce a spurious 'MISSING' the first time. CONVERGENCE INVESTIGATED AND THE FINDING IS THE OPPOSITE OF WHAT THE GAP SUGGESTS: my likelihood has a stable maximum at ll -1025.4148259782, reached identically from three starting points, with gtol from 1e-6 to 1e-12, and after 2 to 20 BHHH iterations. Stata reports -1025.4176185349, which is 2.8e-03 LOWER. An optimiser stopping early lands below the maximum, so Stata is stopping short of the same function's peak rather than maximising a different one -- consistent with e(technique)='bhhh bfgs' and nrtolerance(1e-5), where g'H^-1g < 1e-5 is satisfied before the likelihood is flat. Of the six arch0() priming variants, xb0 (the documented default) is closest to Stata and all alternatives are far worse, so the function itself matches. CONSEQUENCE: westata finds a HIGHER likelihood and its estimates are the maximum-likelihood ones; Stata's are its own stopping point on the way. The gap is therefore not inaccuracy in the usual sense, but matching Stata's premature stop would require reproducing an internal Hessian path that is not documented, and would make the estimates worse in the ML sense. Recorded rather than tuned. IMPACT MEASURED: the significance verdict agrees on all four parameters at the 5% level, but the TEST STATISTICS DO NOT -- Stata z(garch) 9.755 against westata 16.942, and p(omega) 4.97e-02 against 1.55e-03. Significance agrees only because both are deep in the tail; reporting a z value, a Wald statistic or a p-value from this implementation is not transferable to Stata. p(omega) sits at 0.0497 in Stata and 0.0015 here, so a user reading only the 5% verdict would miss that one is marginal and the other is decisive."
- command: dfuller
  level: E3
  tolerance: 1.0e-3
  sources:
    - type: r_crosscheck
      ref: "Live comparison: tsset t; dfuller y on a random walk"
  verified_by: lead
  date: 2026-10-22
  notes: "Z(t) = -1.941126 against Stata's printed -1.941 on a 400-observation random walk, i.e. agreement to its three-decimal display rather than a computational gap. Promoted to E3 during the bandwidth investigation: unlike pperron, dfuller's automatic lag selection already matched, so nothing needed changing -- only measuring. This is the case that shows an E2 label was sometimes the absence of evidence rather than a real shortfall, which is why the whole remaining E2/E1 list was worth re-measuring."

