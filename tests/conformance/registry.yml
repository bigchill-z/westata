# --- P12: complex survey design -------------------------------------------

- command: "svyset / svy: mean"
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "svyset psu [pw=w], strata(stratum) singleunit(certainty); svy: mean y on 576 observations: Stata b 1.061346613529383, V 0.007628317455187414; westata gap 0 and 8.7e-19"
  verified_by: lead
  date: 2026-10-23
  notes: "Taylor linearisation, psi_i = w_i (y_i - ybar) / sum(w), accumulated as PSU totals within strata with the n_h/(n_h-1) factor. THE WEIGHT IS INSIDE psi: my plan said psi_i = y_i/sum(w) and called it verified, but measurement contradicts that -- it gives V 65% low, w_i y_i/sum(w) gives 30% high, and only w_i (y_i - ybar)/sum(w) reproduces Stata at 3e-16. The plan's claim was wrong because the mean it was checked against used a different centring from the score written down, so the numbers never contradicted each other and the error lived only in the prose. Compared against full-precision e(b)/e(V) rather than the printed six decimals, because survey variance conventions agree on the point estimate and diverge in the fourth decimal of the standard error."

- command: "svy: regress"
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "svy: regress y x1 x2: Stata b [0.811277851322903, -0.3624167886992473, 1.0080429196046916], V 3x3; westata max gap 1.1e-15 on b and 1.8e-15 on V"
  verified_by: lead
  date: 2026-10-23
  notes: "Coefficients are weighted least squares; only the covariance is new. THE SCORE IS THE TRAP: it is psi_i = (X'WX)^-1 w_i x_i e_i, and my first attempt used x_i e_i, which left V 167% wrong while the coefficients stayed exact to 1e-15. Both the weight and the inverse are required. The equivalent sandwich form (X'WX)^-1 [PSU covariance of sum(w x e)] (X'WX)^-1 also matches to 9e-14. Reported order is slopes then _cons, as Stata prints it."

- command: "svy: total"
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "svy: total y: full-precision e(b)/e(V) captured with the other design-A commands"
  verified_by: lead
  date: 2026-10-23
  notes: "psi_i = w_i y_i, NOT w_i (y_i - total). Getting that wrong puts V off by a factor of 2.4e5 while the point estimate stays right, and it went unnoticed because the conformance test asserted only np.isfinite on the variance. It now asserts the full-precision value: b gap 0, V gap 4.4e-16. The point estimate satisfies total = mean * sum(w); the VARIANCES are not related by sum(w)^2, which I asserted first and had to withdraw -- the PSU accumulation and the between-stratum spread do not factor through a constant."

- command: "svy: proportion"
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "svy: proportion binary: full-precision capture alongside the design-A commands"
  verified_by: lead
  date: 2026-10-23
  notes: "One parameter per level, each treated exactly like a mean after binarisation, which is what svy: proportion is."

- command: "svy: logit"
  level: E3
  tolerance: 1.0e-9
  sources:
    - type: r_crosscheck
      ref: "svy: logit binary x1 x2: Stata b [1.599752259583883, -0.7175541048578664, -0.037837440539974] and V 3x3; westata b gap 4.8e-10, V gap 4.7e-10"
  verified_by: lead
  date: 2026-10-23
  notes: "Weighted maximum likelihood with the linearised score I^-1 w_i x_i (y_i - p_i). The tolerance is 1e-9 rather than 1e-10 because that residual is STATS's stopping tolerance, not ours: evaluating Stata's score at Stata's own published coefficients gives 1.7e-8, while these estimates are the exact maximiser with a gradient of 8e-15. Asserting 1e-10 would have asserted something false about Stata. This command had NO conformance test at all before, and in the version first committed its coefficients were permuted against Stata's x1/x2/_cons order, putting b off by a factor of 18 while the file stayed green."
- command: svyset fpc / singleunit
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: invariant
      ref: "(1 - n_h/N_h) can only shrink a variance; a lone PSU contributes zero under certainty, the average stratum contribution under scaling, and NaN under missing"
  verified_by: lead
  date: 2026-10-23
  notes: "All three singleunit strategies are implemented and they demonstrably differ: certainty skips the lone-PSU stratum, scaling substitutes the mean of the strata that do vary, missing propagates NaN so a user cannot silently get a number where Stata would refuse. df_r = #PSU - #strata is reported in e(df_r); using nobs there instead would make every t statistic look far more precise than it is."


# --- P13: resampling inference --------------------------------------------

- command: jackknife
  level: E2
  # retest: worst tier C over 4 row(s); example 'jackknife: mean' param_rel 0.0 se_rel 4.58187279692018e-06
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "jackknife: mean y on 400 observations: Stata b 0.7552785610919946, V 0.015102300026884398; westata b gap 0, V gap 3.7e-9"
    - type: r_crosscheck
      ref: "jackknife: regress y x1 x2: Stata b [2.0971960894424284, -0.7312674964177175, 0.9695423493382557]; westata coefficient gap 8.9e-16, V gap 7.4e-6"
  verified_by: lead
  date: 2026-10-23
  notes: "The jackknife is the one resampling method with no random numbers, so it is held to an exact standard and it meets that standard on the coefficients (1e-16) and on the mean's variance (3.7e-9). The regression VARIANCE sits 7.4e-6 away and that residual is understood rather than tuned: a single best-fit scaling of 0.9974973603895577 reproduces the whole matrix to 7.7e-9 while (n-1)/n is 0.9975, so the factor is right and the difference lives in the leave-one-out estimates past their sixth digit -- consistent with Stata updating each fit by Sherman-Morrison instead of refitting. Direct refitting is kept deliberately: it is explainable and independently checkable, and guessing at Stata's update formula to win the sixth digit would trade a verifiable implementation for an unverifiable one. e(expected_gap) records this so a future reader does not chase it again. Both the default pseudovalue form and the mse form are implemented; they are different estimators and a test asserts they differ."

  retest_gap: "independent 386-point sweep graded this E3 -> E2; worst tier C, 4 rows; see retest/REPORT.md"
- command: bootstrap
  level: E2
  # retest: worst tier B over 5 row(s); example 'bootstrap SE of regress (100 reps, seed 20241024)' param_rel 1.1548103805394348e-15 se_rel 8.700151966062607e-09
  tolerance: 1.0e-7
  sources:
    - type: r_crosscheck
      ref: "bootstrap r(mean), reps(200) seed(20261023): Stata _bs_1 b 1.838714755904454, se 0.07917283273150272; westata b gap 0, se gap 1.1e-9 (relative 1.4e-8)"
    - type: published_output
      ref: "[R] set seed reference values: seed 123456789 gives runiform() 0.348871704556195 then 0.266885709753138; seed 472195 gives 0.713028143573182 then 0.920524469911484"
  verified_by: lead
  date: 2026-10-23
  notes: "THIS WAS E2 'BY CONSTRUCTION' AND THAT WAS WRONG. The reasoning was: 'bootstrap variances are functions of the random stream and Stata's generator is not numpy's, so replicate-for-replicate agreement is impossible by construction'. The premise is true of numpy's generator and FALSE of the problem -- Stata uses MT19937-64, a published standard from Matsumoto and Nishimura (1998). Implementing it reproduced the two reference values that [R] set seed prints in its own documentation, which is a check that cannot be faked by fitting. Two steps were needed, and the second is the one that mattered: (1) runiform() matched to one ulp over 400 consecutive draws, and the resampling INDICES matched EXACTLY, 400 out of 400 -- but the bootstrap SE was then still 1.5% off; (2) bsampl_w returns WEIGHTS, not a row sample: it draws a target per row, sorts, builds a running count within each target and keeps one weighted row per target, using a SECOND uniform stream as tie-break. Reproducing that too gives b gap 0 and se gap 1.4e-8. Drawing indices alone reproduces which targets were hit but not their multiplicities. THE GENERAL LESSON: 'impossible by construction' deserves the same scrutiny as any other claim, and here it was one manual page away from being false."
  retest_gap: "independent 386-point sweep graded this E3 -> E2; worst tier B, 5 rows; see retest/REPORT.md"
- command: permute
  level: E1
  # retest: worst tier E over 3 row(s); example 'permute: Monte Carlo p-value across 6 seeds (weak effect, 400 reps)' param_rel 0.012076059850373966 se_rel nan
  tolerance: 5.0e-1
  sources:
    - type: invariant
      ref: "a genuinely driving regressor yields a small permuted p-value; the p-value always lies in [0,1]"
    - type: published_output
      ref: "the permutation stream now comes from the verified MT19937-64 generator"
  verified_by: lead
  date: 2026-10-23
  notes: "Improved from 'arbitrary numpy stream' to the verified Stata generator, but still E2, for a reason narrower than before. The GENERATOR is now correct -- MT19937-64, verified against Stata's documented reference values and against resampling indices. What is still not reproducible is the SHUFFLE ORDER: Stata permutes through its own internal routine whose call sequence is not documented, so a given seed does not produce the same permutation. Since the p-value depends on the empirical distribution of the permuted statistic rather than on any single permutation, the result is statistically equivalent and its MEANING is now anchored to the right generator -- but a cell-for-cell comparison remains unavailable for an honest reason, not a convenient one. bootstrap was promoted to E3 in the same session precisely because its shuffle order IS documented (bsampl_w.ado) while permute's is not."
  retest_gap: "independent 386-point sweep graded this E2 -> E1; worst tier E, 3 rows; see retest/REPORT.md"
- command: bootstrap / permute expressions (exp_list)
  level: E2
  # retest: worst tier B over 2 row(s); example 'bootstrap: SE over 3 further seeds (200 reps each)' param_rel 4.129322963672249e-08 se_rel 4.129322963672249e-08
  tolerance: 1.0e-2
  sources:
    - type: r_crosscheck
      ref: "bootstrap (m: value=r(mean)), reps(2000) seed(20261023): Stata _bs_1 1.838715, se .073721; westata 1.838714755904454, se 0.0735211625879815 (0.27% apart at 2000 replicates)"
    - type: published_output
      ref: "[U] exp_list grammar: exp_list -> (name: elist); elist -> name=(exp) | (exp); specname -> _b | _b[] | _se | _se[] | r(stat) | e(stat)"
  verified_by: lead
  date: 2026-10-23
  notes: "THE PREVIOUS ENTRY HERE SAID THIS WAS OUT OF SCOPE: 'supporting arbitrary r() statistics is equivalent to writing a small expression interpreter'. Reading [U] exp_list showed the premise was half wrong -- it IS an interpreter, but a small CLOSED grammar, not open-ended Stata: exp_list is (name: elist), elist is name=(exp) or (exp), specname is _b/_b[]/_se/_se[]/r(stat)/e(stat), and exp is an arithmetic expression over those. Every production is listable, which is what makes implementing it a bounded task. The parser is recursive descent with Stata's precedence (+- then */ then ^ right-associative then unary sign) and supports exp/ln/sqrt/abs. It is tested against the manual's OWN examples: the two-group summarize form, or=(exp(_b[mpg])), sd=(r(sd)) skew=(r(skewness)), and _b[x1]. Bootstrap.from_expressions exposes replicate stored results as the four tables specname reaches, so any expression in the grammar now works instead of two hard-coded estimators. Two deliberate refusals remain, both raising rather than guessing: bare _b without a coefficient name is ambiguous per coefficient, and an equation-prefixed [eqno]_b[x] is legal Stata but its resolution rule is not documented clearly enough to reproduce. Everything outside the grammar names itself in the error message."
  retest_gap: "independent 386-point sweep graded this E3 -> E2; worst tier B, 2 rows; see retest/REPORT.md"
