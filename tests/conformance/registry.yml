- command: vecrank (Johansen)
  level: E2
  # retest: worst tier C over 6 row(s); example 'vecrank: yc1/yc2, lags(2), trend(constant), max' param_rel 7.79210572574997e-06 se_rel nan
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "vecrank y1 y2 at lags(1): Stata trace [288.3450, 3.7832], eigenvalues [0.50992, 0.00944]; westata [288.3450, 3.7832] with eigenvalues [0.509920, 0.009437]"
    - type: r_crosscheck
      ref: "same at lags(2) [195.9673, 4.1665] and lags(3) [156.0040, 3.7308]; westata identical at both"
  verified_by: lead
  date: 2026-10-23
  notes: "TWO defects were fixed here and both had been masked by the single case the registry checked. (1) johansen() resolved its lag order as 'lags if given, else k_ar_diff if given, else 1' and never consulted the lag order the MODEL was constructed with, so lags(1), lags(2) and lags(3) all returned identical statistics. That constant equalled Stata's lags(2), the one verified configuration. (2) statsmodels' coint_johansen disagrees with Stata at k_ar_diff = 0 -- 287.2485 and 1.7922 against Stata's 288.3450 and 3.7832 -- and the DIAGNOSTIC that exposed it was the asymmetry: the first eigenvalue matched to three decimals while the second was out by a factor of two. A genuine estimation difference cannot behave that way, so the problem was in the statistic rather than the sample. Computing Johansen directly from the moment matrices (regress dy and y_{t-1} on [lagged differences, constant]; solve the generalised eigenproblem for S01'S00^-1 S01 relative to S11; accumulate -T*ln(1-lambda) from the SMALLEST eigenvalue upward) reproduces Stata to all printed decimals at every lag order. The ordering was the detail I had backwards on the first manual attempt, and it is worth recording because it silently doubles the second statistic. Critical values still come from statsmodels' Osterwald-Lenum tables, which are what Stata reports."
  retest_gap: "independent 386-point sweep graded this E3 -> E2; worst tier C, 6 rows; see retest/REPORT.md"
- command: vec (VECM estimation)
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "vec y1 y2, lags(1) rank(1) on a 400-observation cointegrated pair: Stata L._ce1 = [-0.09162245885644234, 0.9229721838807049]; westata alpha gap 3.6e-13"
    - type: r_crosscheck
      ref: "se(alpha): Stata [0.11425557, 0.12730802] vs westata [0.11396886, 0.12698855], gap 3.2e-4"
  verified_by: lead
  date: 2026-10-23
  notes: "Promoted from E1 on re-measurement, and the measurement found a REAL DEFECT rather than a missing feature: VECM.fit passed k_ar_diff = lags, but Stata counts VAR lags while statsmodels counts lagged differences, so Stata lags(1) is k_ar_diff = 0. That exact off-by-one had already been diagnosed and fixed in johansen during the vecrank work and was never carried across to fit -- the two methods disagreed about what a lag means. Fixing it moved alpha from 0.19 away to 3.6e-13. The deterministic default was also wrong: it was ci (constant inside the cointegrating relation) where [TS] vec states the default is an unrestricted constant, i.e. co. Alpha is the comparable quantity because Stata normalises beta away and never prints it. REMAINING GAP, recorded rather than tuned: the drift term. westata det_coef [-0.02271056, -0.03237466] against Stata _cons [-0.02567138, -0.00254837]. That is a reparameterisation question independent of alpha; deriving it would be worth doing, inventing a transform to land on Stata's two numbers would not, so it is stated here and not asserted in the tests."
- command: pperron / kpss
  level: E2
  # retest: worst tier B over 8 row(s); example 'kpss: y_ar, notrend (H0: level stationary), maxlag 5' param_rel 6.096770127348566e-09 se_rel nan
  tolerance: 1.0e-3
  sources:
    - type: r_crosscheck
      ref: "pperron y1 on a 400-observation random walk: Stata prints Newey-West lags = 5 and Z(t) = -1.953; westata -1.953113 with lags=5"
    - type: published_output
      ref: "[TS] pperron default bandwidth: floor(4*(n/100)^(2/9))"
  verified_by: lead
  date: 2026-10-23
  notes: "The recorded 1.6e-2 gap was NEVER an estimator problem. Stata prints 'Newey-West lags = 5' straight in its output and uses the standard rule floor(4*(n/100)^(2/9)); westata was letting arch choose the bandwidth, which picked a different value. Applying the rule gives -1.953113 against Stata's -1.953, i.e. agreement to its three-decimal display. That the rule was visible in Stata's own output and went unread for two batches is the lesson. kpss still cannot be compared: StataNow 19 removed the command (r(199)), the same pattern as xtreg, fd."
  retest_gap: "independent 386-point sweep graded this E3 -> E2; worst tier B, 8 rows; see retest/REPORT.md"
