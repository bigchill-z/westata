  notes: "Was E2 at 'coefficients 4.9e-16, robust SEs 2.9e-2 apart, two-step weight matrix and finite-sample scaling'. The coefficients were indeed exact; the standard errors were 0.2% to 21% off and the recorded cause was a guess. THE MANUAL STATES THE DIFFERENCE IN ONE SENTENCE: W is built from the INITIAL 2SLS RESIDUALS and S from the GMM RESIDUALS. Two different residual sets. linearmodels constructs a single weight matrix and reports a robust sandwich around it, which is a valid estimator but not Stata's, and the discrepancy is invisible to any coefficients-only comparison. Implementing the published formula with the split -- np.linalg.pinv-based, two explicit steps -- brings every standard error to machine precision: 0, 1.4e-17, 6.9e-18. Two rounding attempts were needed on the WRAPPER rather than the maths: the first tested whether the canonical cov_type was None, but _canonical_cov_type(None) returns a default NAME so the branch never fired; the variance stayed wrong and all tests still passed because the coefficients were right. The override now keys off whether the CALLER passed cov_type, so Stata's two-step form is the default while an explicit HC0/HC1/cluster request still works."
