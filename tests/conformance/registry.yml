  notes: "THE TWO SPELLINGS DO NOT SHARE A STANDARD ERROR, and Stata says so by labelling one 'Repeated cross-sectional' and the other 'Longitudinal'. Same ATET, different variance: .0590465 vs .055228. The cause is a degrees-of-freedom convention. In the repeated cross-section the unit effects behave as ordinary regressors, so K = 1 constant + 1 treatment + 1 covariate + 199 unit + 7 period = 209 and N-K = 1391. In the longitudinal case the unit effect is nested in the cluster variable, so only the period effects count: K = 10, N-K = 1590. The variance ratio is sqrt(1391/1590) = 0.935330298501870 against a measured .055228/.0590465 = 0.935330629. Both numbers are now reproduced to 1e-8, and a test pins the closed-form ratio rather than merely asserting that they differ."

