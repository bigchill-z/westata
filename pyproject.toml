[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "westata"
version = "0.0.1"
description = "Stata-conformant econometrics with a statsmodels-style API"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "patsy>=0.5",
    # Required at import time: `estimators/hdfe.py` imports pyfixest at module level because `reghdfe` is a
    # conformance layer over it, and `estimators/iv.py` imports linearmodels the same way for `ivregress`.
    # Both were missing from this list, and the resulting wheel installed cleanly and then failed on import.
    "pyfixest>=0.30",
    "linearmodels>=6.0",
    # Required by `conformance/registry.py`, which is imported from the package's normal surface.
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# `arch` is imported INSIDE functions in `estimators/tseries.py`, so it is only needed for the ARCH/GARCH
# commands. Keeping it optional avoids forcing a large dependency on users who never run those models.
arch = ["arch>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
# sdist 需要显式包含这些顶层文件，否则 CHANGELOG 不会被打包
include-package-data = true
