  notes: "This is a QUASI-likelihood, not a likelihood: the negative binomial is not conditionable the way the Poisson is, and Stata's documentation says so. Recorded as estimator='conditional_quasi_ml' and quasi_likelihood=1 so its log-likelihood is never compared with a real one. The 2.1e-5 gap is the quasi-likelihood converging from a different starting point than Stata's; the tolerance reflects that rather than pretending machine precision."
