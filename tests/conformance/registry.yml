# Evidence registry for westata conformance claims.
# Schema: docs/superpowers/specs/2026-10-22-westata-design.md section 11.3.
#
# E3 entries are backed by tests/conformance/test_stata_e3.py, which compares
# against fixtures captured from StataNow 19.5 (MP) through pystata.  The
# fixtures live in tests/conformance/stata_fixtures/ and can be regenerated with
# scripts/capture_stata_fixtures.py.  E2 entries are backed by published Stata
# output transcribed by hand.  E1 entries are implemented from the manual and
# unit-tested, but have NOT been contrasted with a Stata run.

- command: regress
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Regenerated fixture regress_auto.json: StataNow 19.5, sysuse auto, regress mpg weight foreign"
      dataset: auto.dta
    - type: invariant
      ref: "Coefficients 5.1e-15, standard errors 6.8e-16 relative; e(N), e(df_r), e(df_m), e(r2), e(r2_a), e(rmse), e(F), e(ll) all match"
  verified_by: lead
  date: 2026-10-22
  notes: "Matrix-level comparison against e(b)/e(V), not the printed table."

- command: regress, vce(robust)
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixture regress_auto_robust.json: regress mpg weight foreign, vce(robust)"
      dataset: auto.dta
  verified_by: lead
  date: 2026-10-22
  notes: "HC1 standard errors match at 4.6e-15 relative."

- command: regress, cluster
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Live comparison: regress mpg weight foreign, cluster(grp) with 7 groups"
      dataset: auto.dta
  verified_by: lead
  date: 2026-10-22
  notes: "CR1 standard errors match at 7.1e-15 relative; df_resid = G-1 confirmed."

- command: regress, i.factor
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixture regress_auto_factor.json: regress mpg weight i.foreign"
      dataset: auto.dta
  verified_by: lead
  date: 2026-10-22
  notes: "Stata prints the base level 0b.foreign = 0 explicitly; the comparison drops it. Coefficients match at 3.7e-14."

- command: ivregress 2sls
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Live comparison on a synthetic 2SLS DGP; nonrobust, vce(robust) and vce(cluster) all captured from StataNow 19.5"
  verified_by: lead
  date: 2026-10-22
  notes: "Coefficients 7.8e-15; standard errors 7.5e-15 (nonrobust), 1.6e-14 (robust), 1.9e-14 (cluster). Two real defects were found this way and fixed: (1) westata omitted the constant that Stata adds by default; (2) the nonrobust VCE used s^2=ESS/(N-k) whereas Stata's default is ESS/N (the N-k form requires the `small` option). e(df_r) is recorded as N because Stata stores missing (.) there; e(chi2), e(r2), e(r2_a), e(rmse) match at 1e-16."

- command: logit
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "Fixture logit_sim.json: logit y x1 x2 on a 600-observation logistic DGP"
    - type: invariant
      ref: "z-distribution p-values and McFadden pseudo R2 in e(r2_p)"
  verified_by: lead
  date: 2026-10-22
  notes: "Coefficients agree to ~1e-7. The limit is the optimiser path, not the formula: Stata's Newton and statsmodels' converge to the same optimum but stop at slightly different points on a flat likelihood."

- command: probit
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "Fixture probit_sim.json: probit y x1 x2"
  verified_by: lead
  date: 2026-10-22
  notes: "Measured 1.5e-7; same optimiser-path limit as logit."

- command: poisson
  level: E3
  tolerance: 1.0e-9
  sources:
    - type: r_crosscheck
      ref: "Fixture poisson_sim.json: poisson y x1"
  verified_by: lead
  date: 2026-10-22
  notes: "Coefficients and standard errors match at 3.9e-13."

- command: test
  level: E2
  tolerance: 3.0e-5
  sources:
    - type: published_output
      ref: "Stata [R] regress on auto.dta prints F(2, 71) = 69.75; westata computes 69.7485"
    - type: invariant
      ref: "For q=1 the F statistic equals the squared coefficient t statistic"
  verified_by: lead
  date: 2026-10-22
  notes: "The 2.2e-5 relative difference is Stata's display rounding (69.75), not a computational gap; the underlying Wald form is asserted against hand computation in tests/test_postestimation.py."

- command: lincom
  level: E2
  tolerance: 5.0e-7
  sources:
    - type: published_output
      ref: "Stata [R] lincom on auto.dta: estimate -1650.036, std. err. 1075.994"
    - type: invariant
      ref: "Single-coefficient lincom equals the model's coefficient, SE, t and p exactly"
  verified_by: lead
  date: 2026-10-22
  notes: "Reproduces [R] lincom semantics including level() and eform."

- command: tobit
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "Live comparison: tobit y x1 x2, ll(2) on an 800-observation censored DGP"
    - type: invariant
      ref: "Log-likelihood matches an independent implementation of the [R] tobit formula at 1e-12"
  verified_by: lead
  date: 2026-10-22
  notes: "Slopes 8.5e-8, standard errors 6.4e-7. Stata reports var(e.y) = sigma^2 in e(b); westata reports /sigma, so that parameter is compared squared. The self-implemented likelihood is confirmed correct against real Stata, which is the outcome that mattered most for this estimator."

- command: arima
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "Live comparison: arima y, arima(1,0,0) against westata.ARIMA(trend='c') on a 500-observation AR(1)"
    - type: invariant
      ref: "Same likelihood: statsmodels loglike evaluated at Stata's parameters (-708.1566933126) is LOWER than at statsmodels' optimum (-708.1566922756), so both maximise the same function"
  verified_by: lead
  date: 2026-10-22
  notes: "Measured 4.8e-5 on the AR coefficient, 9.8e-5 on the constant, 4.0e-5 on sigma. An earlier version used enforce_stationarity=False/enforce_invertibility=False, which changed the optimiser parameterisation and produced a 1.9e-3 gap (40x worse); removing them is the fix. The residual difference is a stopping-point difference, proven by the likelihood comparison above: statsmodels stops marginally closer to the maximum than Stata. scripts/diagnose_arima.py reproduces this."


# --- P5: postestimation completion -----------------------------------------

- command: nlcom
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "nlcom exp(_b[x1]) after regress: Stata 7.298097, se .3291511, CI [6.652973, 7.943221]; westata identical"
    - type: r_crosscheck
      ref: "nlcom _b[x1]/_b[x2]: Stata -1.911292, se .0912806; westata identical"
  verified_by: lead
  date: 2026-10-23
  notes: "Delta method G V G' with central differences. Stata's nlcom reports z / P>|z| and a NORMAL interval even after regress -- the fixture's [6.652973, 7.943221] is est -/+ 1.959964*se, while a t(196) interval would be [6.648965, 7.947229]. westata follows Stata, so nlcom and lincom agree on the estimate and standard error but not on the p-value or interval. An earlier draft used the model's t distribution and was wrong for this reason."

- command: testnl
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "testnl exp(_b[x1]) = 2: Stata chi2(1) = 259.09; westata 259.0891"
    - type: r_crosscheck
      ref: "testnl _b[x1] = _b[x2]: Stata chi2(1) = 2146.92"
  verified_by: lead
  date: 2026-10-23
  notes: "Expressions are parsed with ast and a whitelist; there is no eval anywhere, so __import__, attribute access, lambdas and containers all raise ValueError. Joint constraints are accepted as comma-, whitespace- or parenthesised lists."

- command: lrtest
  level: E3
  tolerance: 1.0e-3
  sources:
    - type: r_crosscheck
      ref: "lrtest small big on y ~ x1 vs y ~ x1 + x2 + x3: Stata LR chi2(2) = 300.40; westata 300.40"
  verified_by: lead
  date: 2026-10-23
  notes: "Verifies nesting (restricted names must be a subset) and equal nobs. df == 0 (identical models) returns p = 1.0 rather than raising, since chi2(0) is a point mass and scipy would return nan; an argument-order mistake (unrestricted having FEWER parameters) still raises."

- command: hausman
  level: E3
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "hausman fe re after xtreg on a 40x6 panel: Stata chi2(2) = 0.23, p = 0.8923; westata 0.2280, p = 0.8923"
  verified_by: lead
  date: 2026-10-23
  notes: "The constant is excluded from the comparison, matching [R] hausman's default. Including it makes V_consistent - V_efficient naturally indefinite (eigenvalues [-0.0212, 1.2e-05, 1.9e-05] on a plain panel) because a within-transformed intercept and a GLS intercept estimate different quantities. A non-positive-definite difference falls back to a generalised inverse with a RuntimeWarning, as Stata does."

- command: contrast
  level: E3
  tolerance: 2.0e-6
  sources:
    - type: r_crosscheck
      ref: "contrast r.g on a 3-level factor: Stata (1 vs 0) .8134023 se .0699776, (2 vs 0) -.5222208 se .0705751"
    - type: r_crosscheck
      ref: "contrast a.g: Stata (0 vs 1) -.8134023, (1 vs 2) 1.335623"
    - type: r_crosscheck
      ref: "contrast g.g: Stata -.0970605, .7163418, -.6192813"
  verified_by: lead
  date: 2026-10-23
  notes: "Direction matters and was verified: Stata's a. reports low-vs-high, the opposite sign to r.'s high-vs-low. h. (Helmert) and m. (multiple-comparison) raise UnsupportedError, as does sum/Helmert coding, because those coefficients are already contrasts rather than level means."

- command: pwcompare
  level: E3
  tolerance: 2.0e-6
  sources:
    - type: r_crosscheck
      ref: "pwcompare g: Stata 1 vs 0 .8134023, 2 vs 0 -.5222208, 2 vs 1 -1.335623"
  verified_by: lead
  date: 2026-10-23
  notes: "adjust() accepts only None. Bonferroni/Holm/Sidak raise UnsupportedError rather than returning unadjusted p-values under a correction label."

- command: predict, stdp/stdf
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "predict stdp and stdf after regress mpg weight foreign: 74 observations captured from StataNow 19.5"
  verified_by: lead
  date: 2026-10-23
  notes: "stdp = sqrt(x'Vx), stdf = sqrt(x'Vx + sigma^2) with sigma^2 from e(rmse)^2 or rss/N. stdf is offered only for the linear families: verified that Stata's logit and poisson reject predict, stdf with r(198) 'option stdf not allowed', so westata refuses it too instead of returning a number under a name Stata will not produce."


# --- P6: limited dependent variables ---------------------------------------

- command: truncreg
  level: E3
  tolerance: 1.0e-3
  sources:
    - type: r_crosscheck
      ref: "truncreg y x1 x2, ll(0) on 582 truncated observations: Stata x1 1.568894, x2 -.5033393, _cons .9280214, /sigma .8153158"
  verified_by: lead
  date: 2026-10-23
  notes: "Self-implemented truncated likelihood; verified against Stata's coefficients and scale. With very wide limits it reduces to OLS, which is pinned by a unit test."

- command: intreg
  level: E3
  tolerance: 1.0e-3
  sources:
    - type: r_crosscheck
      ref: "intreg lo hi x1 on 600 interval-censored observations: Stata x1 1.197311, _cons 1.94128, /lnsigma -.0827015"
  verified_by: lead
  date: 2026-10-23
  notes: "Reports /lnsigma like Stata, not /sigma. With point intervals (lo == hi == y) it reduces to OLS."

- command: heckman
  level: E3
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "heckman y x, select(selected = z) on 1500 observations: Stata y:x 1.965111 (se .0367055), y:_cons 1.026726 (se .0706062), selected:z .8021853 (se .0433423), lambda .2861034"
  verified_by: lead
  date: 2026-10-23
  notes: "TWO-STEP estimator with the Heckman correction applied to the standard errors (e(se_corrected) = 1). The corrected SEs land within 3% of Stata's ML SEs: y:x 0.036413 vs .0367055, y:_cons 0.072621 vs .0706062, select:z 0.042623 vs .0433423. The correction is validated independently against a 400-rep row bootstrap. e(lambda) follows Stata's definition rho*sigma (verified: .2849988 * 1.003876 = .2861035); westata reports .287883, 0.6% from Stata, and keeps the generated-regressor coefficient in e(lam_coef). rho itself remains a plug-in value rather than the ML estimate, so it is excluded from the comparison. method='ml' still raises UnsupportedError."

- command: etregress
  level: E1
  tolerance: 5.0e-2
  sources:
    - type: invariant
      ref: "Control-function estimator runs and produces finite parameters"
  verified_by: lead
  date: 2026-10-23
  notes: "Control function only; no Stata comparison yet. method='ml' raises UnsupportedError."

# --- P7: count model extensions --------------------------------------------

- command: zip
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "zip y x1, inflate(x1) on 1200 observations with 25% structural zeros: Stata x1 .559456, _cons .4039659, inflate x1 .0033665, inflate _cons -1.016455"
  verified_by: lead
  date: 2026-10-23
  notes: "All four coefficients match Stata to 1e-4. With inflate=None the model reduces exactly to Poisson, which is pinned by a unit test."

- command: zinb
  level: E3
  tolerance: 1.0e-2
  sources:
    - type: r_crosscheck
      ref: "zinb y x1, inflate(_cons) on 1200 overdispersed observations: Stata LR chi2(1) = 293.89, ll = -2028.728"
  verified_by: lead
  date: 2026-10-23
  notes: "chi2 and ll reproduce Stata exactly. The dispersion is reported as /lnalpha. The inflation intercept is weakly identified in this DGP (westata -13.24 vs Stata -14.07, both with SE in the hundreds), so only finiteness is asserted for it."

- command: ztp
  level: E3
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "ztp y x1 on 660 positive counts: Stata x1 .5415945, _cons .4189287"
  verified_by: lead
  date: 2026-10-23
  notes: "Self-implemented zero-truncated likelihood; log-likelihood is also asserted against the closed form."

- command: tnbreg
  level: E3
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "tnbreg y x1, ll(0) on 802 positive counts: Stata x1 .6035713"
  verified_by: lead
  date: 2026-10-23
  notes: "Stata requires ll() strictly below the minimum observed y; ll(1) on data whose minimum is 1 returns r(459), which westata replicates as a ConsistencyError."


# --- P8: quantile and robust regression ------------------------------------

- command: qreg
  level: E3
  tolerance: 1.0e-3
  sources:
    - type: r_crosscheck
      ref: "qreg y x1 x2, quantile(.25/.5/.75/.9) on 600 heteroskedastic observations: Stata coefficients 2.042842/-.8013571/.518284, 1.965287/-.7475726/.979461, 1.978264/-.7318384/1.517499, 1.996667/-.7252009/2.097133"
    - type: r_crosscheck
      ref: "Standard errors at quantile(.5): Stata .0355009/.0340052/.0355825 vs westata .0355009/.0340052/.0355825 (identical)"
  verified_by: lead
  date: 2026-10-23
  notes: "Coefficients, standard errors and Pseudo R2 all reproduce Stata to the printed precision at all four quantiles. The covariance uses Stata's DEFAULT sparsity estimator, which [R] qreg documents as 'fitted': re-estimate the regression at tau+h and tau-h, form xbar'b at each, and difference over 2h, with the Hall-Sheather bandwidth. Using a kernel density of the residuals instead is the vce(iid, kernel()) option and shifts x1's standard error by 29% (.0457925 vs .0355009) -- that was the trap this batch was written to avoid. e(sum_adev) and e(sum_rdev) are values of the CHECK function sum (tau - 1{u<0})u, not sums of absolute deviations; at tau=.25 Stata prints 156.7522 and the check function gives 156.7522 while the absolute sum gives 465.2928."

- command: qreg, vce(robust)
  level: E3
  tolerance: 1.0e-5
  sources:
    - type: r_crosscheck
      ref: "qreg y x1 x2, quantile(.5) vce(robust): Stata x1 .0352211, x2 .0336117, _cons .0359358; westata reproduces all three to 1e-6"
  verified_by: lead
  date: 2026-10-23
  notes: "Huber sandwich with an OBSERVATION-SPECIFIC density f_i = 2h / (x_i'(b(tau+h) - b(tau-h))): J = sum f_i x_i x_i', V = J^-1 M J^-1. No n/(n-k) fudge factor. Two earlier versions were wrong: the first dropped the density entirely (SEs 42% too small, .0204 vs .0352), the second used a scalar density at xbar plus an ad-hoc correction (1.05% high). CAVEAT: the fixture only exercises tau=.5, where psi_i^2 = 0.25 for every observation, so M collapses to tau(1-tau)X'X and the general-tau moment form is not directly evidenced -- only the .5 case is verified."

- command: rreg
  level: E3
  tolerance: 2.0e-2
  sources:
    - type: r_crosscheck
      ref: "rreg y x1 x2 on 400 observations with 5% of y contaminated by scale-30 noise: Stata x1 2.014204, x2 -.5340517, _cons .9933214"
  verified_by: lead
  date: 2026-10-23
  notes: "Full [R] rreg algorithm implemented: Cook's D > 1 screen, then s = MAD/0.6745, then Huber weights (c_h = 1.345) to convergence, then biweights (c_b = 4.685*tune/7) to convergence, with pseudovalue standard errors. Coefficients measure 2.0144573 / -.5341 / .9933 against Stata's 2.014204 / -.5340517 / .9933214. The Cook's screen drops nothing on this DGP (max D = 0.218) and Stata agrees -- the contamination is handled by the weights, not by deletion. STANDARD ERRORS do not match exactly: .0548424 / .0543542 / .0545657 vs Stata's .0564219 / .0525755 / .0545107, i.e. -2.8% / +3.4% / +0.1%. An earlier version was 26-36% wrong because its leave-one-out refit used a generic weighted least squares instead of the actual Huber-then-biweight estimator; that is fixed. The residual gap exists because [R] rreg cites Street-Carroll-Ruppert (1988) without specifying the leave-one-out construction. Documented rather than tuned. e(F) consequently differs by 0.8% (683.6 vs 688.92)."

- command: sqreg
  level: E1
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "sqreg y x1 x2, quantiles(.25 .5 .75) reps(200): Stata x1 SE .0705717/.0506841/.0709206; westata .0682194/.0429598/.0675913"
  verified_by: lead
  date: 2026-10-23
  notes: "Coefficients are exact (they are the qreg fits, verified above). The bootstrap STANDARD ERRORS do not match: ratios 0.97/0.85/0.95. Stata seeds from its own RNG so a cell-for-cell match is impossible by construction, but the systematic downward bias suggests its resampling scheme differs -- most likely a different replicate-variance convention. Left at E1 rather than claiming agreement; this is the honest state."

- command: bsqreg
  level: E1
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "bsqreg y x1 x2, quantile(.5) reps(200): Stata x1 SE .049082; westata .0429598"
  verified_by: lead
  date: 2026-10-23
  notes: "Coefficients exact (identical to qreg by construction -- bsqreg is sqreg with one quantile, which the subclassing makes structural). Bootstrap SE 12% below Stata's, the same systematic gap as sqreg. E1, not E3."

# --- Not yet contrasted with a real Stata run (E1) -------------------------

- command: margins
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "Live comparison: logit y x1 x2 then margins, dydx(x1 x2) on 800 observations"
    - type: invariant
      ref: "Average marginal effects match closed forms: logit mean(p(1-p)b), probit mean(phi(xb)b), poisson mean(mu)b"
  verified_by: lead
  date: 2026-10-22
  notes: "Marginal effects 1.6e-7, standard errors 5.2e-6. An earlier version differentiated xb instead of the response and was 4.38x too large; this comparison is what confirms the fix."

- command: xtreg, fe
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixture xtreg_fe.json: xtset firm year; xtreg y x1 x2, fe (30 entities x 6 periods)"
    - type: statsmodels_reference
      ref: "PanelOLS vs hand-coded within transform"
  verified_by: lead
  date: 2026-10-22
  notes: "Parameters 1.8e-16, standard errors 1.9e-16, e(df_r)=148 and e(r2) both exact. The df rule N-K-n_entities+1 is confirmed against Stata, not just derived."

- command: xtreg, re
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixture xtreg_re.json: xtreg y x1 x2, re"
  verified_by: lead
  date: 2026-10-22
  notes: "Parameters 6.8e-16, standard errors 1.0e-15: linearmodels' Swamy-Arora matches Stata's default exactly."

- command: xtreg, be
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixture xtreg_be.json: xtreg y x1 x2, be"
  verified_by: lead
  date: 2026-10-22
  notes: "Parameters 3.6e-16, standard errors 1.7e-16."

- command: xtreg, fd
  level: E3
  tolerance: 1.0e-8
  sources:
    - type: r_crosscheck
      ref: "Compared against regress D.y D.x1 D.x2, noconstant, because StataNow 19 removed the fd option from xtreg (r(198))"
  verified_by: lead
  date: 2026-10-22
  notes: "Parameters 7.5e-9, standard errors 8.8e-10. Verified in StataNow 19.5 that `xtreg, fd` is no longer a valid option, so a direct comparison is impossible; the first-difference identity is used instead."

- command: areg
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixture areg.json: areg y x1 x2, absorb(firm)"
  verified_by: lead
  date: 2026-10-22
  notes: "Slopes 4.6e-16, standard errors 1.8e-16, e(df_r) exact. This also validates FEOLS's ssc defaults for the single-FE case. reghdfe itself could not be installed (SSC timed out), so the multi-way HDFE path remains E1."

- command: reghdfe
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixtures reghdfe_firm*.json: reghdfe y x1 x2, absorb(firm) / absorb(firm year), with nonrobust, vce(robust) and cluster(firm)"
    - type: invariant
      ref: "e(N), e(r2), e(r2_a), e(df_r) and e(rmse) all match the captured scalars"
  verified_by: lead
  date: 2026-10-22
  notes: "Installed from the author's GitHub sources because SSC (fmwww.bc.edu) is unreachable from this network; scripts/install_reghdfe.py also fetches the ftools and require dependencies. All five specifications match at 4.4e-16 (params), 2.0e-16 (SE) and 0-2.2e-16 on every e() scalar. Reproducing e(df_r), e(rmse) and e(r2_a) required separating three different degrees of freedom: e(df_r)=G-1 under clustering (nested FE treated as redundant), e(rmse)=sqrt(rss/(N-rank)), e(r2_a)=1-(1-r2)(N-1)/(N-rank_full) where rank_full counts every absorbed level minus one redundancy per extra effect."

- command: ivregress liml
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixture iv_liml.json: ivregress liml y x2 (x = z1 z2)"
  verified_by: lead
  date: 2026-10-22
  notes: "Parameters and standard errors both 3.7e-16."

- command: ivregress gmm
  level: E2
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "Fixture iv_gmm.json: ivregress gmm y x2 (x = z1 z2)"
  verified_by: lead
  date: 2026-10-22
  notes: "Point estimates 4.9e-16 but robust standard errors differ by 2.9e-2. GMM's two-step weight matrix and finite-sample scaling are constructed differently from Stata's; the coefficients are right, the inference is not. Deliberately not tuned to match."

- command: nbreg
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "Fixture nbreg.json: nbreg y x1 on a Gamma-Poisson mixture"
  verified_by: lead
  date: 2026-10-22
  notes: "Parameters 1.7e-5, standard errors 9.1e-7, e(ll) 8e-12. Fixing this required converting statsmodels' alpha to Stata's lnalpha via the delta method: the values differed by a factor of exp() before."

- command: ologit
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "Fixture ologit.json: ologit y x1 x2 (3 categories)"
  verified_by: lead
  date: 2026-10-22
  notes: "Slopes 1.2e-5, cut points 2.9e-5. statsmodels stores thresholds as [c1, log(c2-c1)], so reporting them directly made cut2 wrong by 20%; the log-increment is now inverted before reporting."

- command: oprobit
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "Fixture oprobit.json: oprobit y x1 x2"
  verified_by: lead
  date: 2026-10-22
  notes: "Slopes 6.9e-6, cut points 1.5e-5."

- command: var
  level: E3
  tolerance: 1.0e-12
  sources:
    - type: r_crosscheck
      ref: "Fixture var.json: tsset t; var y1 y2, lags(1)"
  verified_by: lead
  date: 2026-10-22
  notes: "Lag coefficients 2.9e-15. Both are equation-by-equation OLS, so exact agreement is expected once the ordering (Stata groups by equation) is handled."

- command: arch
  level: E2
  tolerance: 5.0e-2
  sources:
    - type: r_crosscheck
      ref: "Live comparison: tsset t; arch r, arch(1) garch(1) on a GARCH DGP"
  verified_by: lead
  date: 2026-10-22
  notes: "alpha 6.9e-3, beta 6.3e-4, mean constant 3.6e-2. omega is not stored in Stata's e(b) under a comparable name, so the variance intercept is not compared. Stata uses OPG standard errors by default while arch uses the Hessian; the point estimates are close but not identical because the optimisers differ."

- command: dfuller
  level: E2
  tolerance: 5.0e-4
  sources:
    - type: r_crosscheck
      ref: "Live comparison: tsset t; dfuller y on a random walk"
  verified_by: lead
  date: 2026-10-22
  notes: "Z(t) matches to 2.3e-4, which is the limit of Stata's 3-decimal display rather than a computational gap."

- command: predict
  level: E3
  tolerance: 1.0e-9
  sources:
    - type: r_crosscheck
      ref: "predict xb/residuals after regress mpg weight foreign; predict pr/xb after logit; predict e(2,.)/ystar(2,.) after tobit, all captured from StataNow 19.5"
  verified_by: lead
  date: 2026-10-23
  notes: "xb 1.6e-15, residuals 5.1e-13 (OLS); pr 3.1e-11, xb 3.6e-10 (logit); e(a,b) and ystar(a,b) both 5.8e-10 (tobit). Two real defects fixed here: (1) the tobit e(a,b) and ystar(a,b) implementations were swapped; (2) e(a,b) overflowed for observations whose linear index was far inside the interval, because 1-Phi(z) rounds to 0 for z>7. [R] tobit postestimation defines e(a,b)=E(y|a<y<b) (conditional) and ystar(a,b)=E(y*) with y*=max{a,min{y,b}} (unconditional)."

- command: etable
  level: E3
  tolerance: 5.0e-7
  sources:
    - type: r_crosscheck
      ref: "esttab m1 m2, b(%9.6f) se(%9.6f) star(* 0.05 ** 0.01 *** 0.001) plain compared cell-by-cell with ws.etable"
  verified_by: lead
  date: 2026-10-23
  notes: "estout installed from the author's GitHub source (SSC unreachable). Coefficients agree exactly at the printed precision (gap 0.0). The tolerance is 5e-7 because esttab reports 6 decimals."

- command: vecrank (Johansen)
  level: E2
  tolerance: 5.0e-5
  sources:
    - type: r_crosscheck
      ref: "vecrank y1 y2, lags(2) on a cointegrated pair: Stata trace=[195.9673, 4.1665] vs westata [195.9673, 4.1665]"
    - type: published_output
      ref: "[TS] vecrank: 'lags(#) specifies the number of lags in the VAR representation. The VEC model will include one fewer lag of the first differences.'"
  verified_by: lead
  date: 2026-10-23
  notes: "The lag convention is now settled: Stata lags(#) maps to statsmodels k_ar_diff = # - 1, and johansen(lags=...) applies it. lags(2) agrees to all four printed decimals, which also confirms statsmodels' Johansen implementation matches Stata's. One residual gap is documented rather than tuned: lags(1) (k_ar_diff=0) gives 287.2485 where Stata prints 288.3450 (0.4% apart), while the first eigenvalue agrees to 1e-3 (0.51102 vs 0.50992). That points at boundary handling when there are no lagged differences, not at the estimator, and tests/conformance/test_stata_vecrank.py pins the current behaviour so a silent 'fix' would be caught."

- command: vec (VECM estimation)
  level: E1
  tolerance: 1.0e-1
  sources:
    - type: invariant
      ref: "VECM fits and returns coefficients on a cointegrated pair"
  verified_by: lead
  date: 2026-10-23
  notes: "Only the rank test (vecrank) has been compared with Stata. The VECM coefficient estimates themselves have not."

- command: pperron / kpss
  level: E2
  tolerance: 2.0e-2
  sources:
    - type: r_crosscheck
      ref: "pperron y on a random walk: Stata Z(t) = -1.896, westata -1.927135"
  verified_by: lead
  date: 2026-10-23
  notes: "Phillips-Perron differs by 1.6e-2. Stata prints 3 decimals, so part of this is display precision, but 1.6e-2 is larger than the display limit, indicating a genuine difference in the default lag truncation. kpss cannot be compared: kpss is no longer a StataNow 19 command (`command kpss is unrecognized`), the same removal pattern as xtreg, fd."

# --- Note on the count models' null baseline ------------------------------
#
# Stata does not use one null model for all four count commands, and getting
# this wrong shifts chi2, p and pseudo-R2 without touching a single coefficient:
#
#   zip / zinb / tnbreg   a *fitted* constant-only model (Stata prints the
#                         "Fitting constant-only model" block)
#   ztp                   mean(y) with the truncation applied (no such block)
#
# Verified numerically: for ztp the fitted-constant route gives chi2 246.25,
# which matches no Stata output, while mean(y) gives 270.42 exactly. An earlier
# implementation used mean(y) everywhere and consequently reported zip chi2
# 657.68 against Stata's 248.04.

# --- Note on predict coverage for the P6/P7 models -------------------------
#
# Registered and verified against StataNow 19.5 on 2026-10-23:
#
#   truncreg, intreg, heckman, etregress   xb, stdp, stdf  (continuous models)
#   zip, zinb, ztp, tnbreg                 xb, n, stdp     (count models)
#
# A count model rejects stdf with r(198) "option stdf not allowed"; the same split
# exists for poisson/nbreg. westata mirrors it rather than offering a type Stata
# will not produce.
