  notes: "The POINT ESTIMATE is exact (3.6e-15); only the standard error differs, down from 2.2% to 1.59%. Method: the manual was consulted instead of guessing at variance estimators -- something I had failed to do through roughly fifteen earlier attempts, every one of which consisted of trying a different sigma^2(X_i) formula from memory. The manual gives the estimator and, crucially, states the DEFAULT: robust standard errors from TWO matches, i.e. vce(robust, nn(2)). Five variants of the within-arm variance were then measured against Stata rather than argued about: (A) literal (sum w - 1) divisor, se 0.4548; (B) exclude i, var of the two neighbours, 0.10222; (C) include i plus two neighbours, sample variance, 0.10458; (D) the h=1 form 0.5(y_i-y_j)^2, 0.10780; (E) 0.5*C, 0.07395. C is adopted as closest. NOTE ON A LITERAL READING I GOT WRONG: applying '(sum w_j - 1)' with unit weights and h = 2 makes ybar the SUM of the neighbours rather than their mean and inflates the variance about fourfold (variant A). The formula is written for the general weighted case; the unweighted instance needs a plain sample variance. REMAINING 1.59%: _matchnn_estimates is compiled Mata bytecode, so there is no source to read. Its symbol table IS legible (strings on lmataado.mlib yields _matchnn_biasAdjustedMeans, __matchnn_lsfit, _matchnn_indices, _matchnn_neighbors, _matchnn_scaleVariables, _matchnn_estimates), which confirms the algorithm's structure but not its arithmetic. Reaching E3 would need disassembly of Mata bytecode, and the residual may equally be a distance or tie-handling difference. Left at E2 with the number recorded."
