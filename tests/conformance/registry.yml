# Evidence registry for westata conformance claims.
# Schema: docs/superpowers/specs/2026-10-22-westata-design.md section 11.3.
# Entry-level `tolerance` is the binding one; per-source detail is free-form.

- command: regress
  level: E2
  tolerance: 5.0e-5
  sources:
    - type: published_output
      ref: "Stata [R] regress, auto.dta: regress mpg weight foreign (n=74); output rounded to 6-7 significant digits"
      dataset: auto.dta
    - type: statsmodels_reference
      ref: "Full-precision algebraic cross-check; westata vs statsmodels OLS at 1e-10"
      dataset: auto.dta
  verified_by: lead
  date: 2026-10-22
  notes: "E3 pending an R (estimatr se_type='stata') cross-check on the same dataset."

- command: ivregress 2sls
  level: E1
  tolerance: 1.0e-10
  sources:
    - type: statsmodels_reference
      ref: "westata IV2SLS vs linearmodels.iv.IV2SLS (params, unadjusted/HC1/cluster SE) at 1e-16"
    - type: published_output
      ref: "Stata [R] ivregress Example 1 (hsng, n=50): table reports z / P>|z| and Wald chi2(2); westata uses dist='z' accordingly"
  verified_by: lead
  date: 2026-10-22
  notes: "E2 blocked: hsng.dta not yet wired into the fixture set."

- command: ivregress liml
  level: E1
  tolerance: 1.0e-10
  sources:
    - type: statsmodels_reference
      ref: "westata IVLIML vs linearmodels.iv.IVLIML at machine precision"
  verified_by: lead
  date: 2026-10-22
  notes: "e(ll) is the Gaussian likelihood at the estimates, not Stata's concentrated LIML likelihood."

- command: ivregress gmm
  level: E1
  tolerance: 1.0e-10
  sources:
    - type: statsmodels_reference
      ref: "westata IVGMM vs linearmodels.iv.IVGMM at machine precision"
  verified_by: lead
  date: 2026-10-22

- command: reghdfe
  level: E1
  tolerance: 1.0e-10
  sources:
    - type: statsmodels_reference
      ref: "FEOLS vs statsmodels OLS with explicit dummies (one-way FE) and vs two-way demeaned OLS at 1e-10"
    - type: invariant
      ref: "FEOLS with no fixed effects must reproduce westata OLS exactly"
  verified_by: lead
  date: 2026-10-22
  notes: "ssc defaults follow reghdfe (k_adj=True, G_adj=True, G_df='min'); not yet contrasted with real reghdfe output."

- command: xtreg, fe
  level: E1
  tolerance: 1.0e-10
  sources:
    - type: statsmodels_reference
      ref: "PanelOLS vs hand-coded within transform + OLS, and two-way FE vs two-way demeaned OLS, at 1e-10"
    - type: invariant
      ref: "df_r = N - K - n_entities + 1 asserted for a 5x4 balanced panel"
  verified_by: lead
  date: 2026-10-22
  notes: "E2 blocked: needs a published xtreg, fe output on a public dataset. Clustered VCE pinned to auto_df=False + group_debias=True after verifying it is the only setting that reproduces manual CR1 (0.11205179 vs 0.09996617 for the backend default)."

- command: xtreg, re
  level: E1
  tolerance: 1.0e-12
  sources:
    - type: statsmodels_reference
      ref: "RandomEffects vs linearmodels RandomEffects (Swamy-Arora) params and standard errors at 1e-12"
  verified_by: lead
  date: 2026-10-22
  notes: "linearmodels is the implementation westata wraps, so this checks the wrapper, not Stata."

- command: xtreg, be
  level: E1
  tolerance: 1.0e-10
  sources:
    - type: statsmodels_reference
      ref: "BetweenOLS vs hand-coded group-mean OLS at 1e-10"
  verified_by: lead
  date: 2026-10-22

- command: xtreg, fd
  level: E1
  tolerance: 1.0e-10
  sources:
    - type: statsmodels_reference
      ref: "FirstDifferenceOLS vs hand-coded first-difference OLS without constant at 1e-10"
  verified_by: lead
  date: 2026-10-22

- command: test
  level: E2
  tolerance: 1.0e-10
  sources:
    - type: published_output
      ref: "Stata [R] regress on auto.dta prints F(2, 71) = 69.75 for the joint test of weight and foreign; westata test('weight foreign') reproduces 69.75 exactly"
      dataset: auto.dta
    - type: invariant
      ref: "For q=1 the F statistic equals the squared coefficient t statistic"
  verified_by: lead
  date: 2026-10-22
  notes: "Uses the [R] test formula W=(Rb-r)'(RVR')^-1(Rb-r), with F=W/q for t models and chi2(q) for z models."

- command: lincom
  level: E1
  tolerance: 1.0e-12
  sources:
    - type: invariant
      ref: "Single-coefficient lincom equals the model's own coefficient, standard error, statistic and p-value exactly"
    - type: published_output
      ref: "Stata [R] lincom: estimate Lb, variance LVL', t with e(df_r), plus level() and eform options"
  verified_by: lead
  date: 2026-10-22

- command: etable
  level: E1
  tolerance: 1.0e-15
  sources:
    - type: invariant
      ref: "Coefficient and standard-error rows come from params/bse unchanged; the Observations row equals e(N)"
  verified_by: lead
  date: 2026-10-22
  notes: "Presentation layer; correctness means the numbers are the results object's, unaltered. The tolerance is machine epsilon because the values must match exactly."

- command: logit
  level: E1
  tolerance: 1.0e-8
  sources:
    - type: statsmodels_reference
      ref: "westata Logit vs statsmodels Logit (params 1e-8, bse 1e-6); both use observed information, like Stata's default"
    - type: invariant
      ref: "z-distribution p-values and McFadden pseudo R2 in e(r2_p)"
  verified_by: lead
  date: 2026-10-22
  notes: "E2 blocked: needs a published logit output on a public dataset."

- command: probit
  level: E1
  tolerance: 1.0e-8
  sources:
    - type: statsmodels_reference
      ref: "westata Probit vs statsmodels Probit at 1e-8"
  verified_by: lead
  date: 2026-10-22

- command: poisson
  level: E1
  tolerance: 1.0e-8
  sources:
    - type: statsmodels_reference
      ref: "westata Poisson vs statsmodels Poisson for both nonrobust and HC0 standard errors"
  verified_by: lead
  date: 2026-10-22
  notes: "statsmodels' Poisson covariance rejects cov_kwds; handled explicitly rather than suppressed."

- command: nbreg
  level: E1
  tolerance: 1.0e-6
  sources:
    - type: invariant
      ref: "Dispersion parameter named /lnalpha like Stata; bfgs is required because newton diverges"
  verified_by: lead
  date: 2026-10-22
  notes: "Weakest evidence in the discrete family; no Stata output to contrast."

- command: ologit / oprobit
  level: E1
  tolerance: 1.0e-6
  sources:
    - type: invariant
      ref: "Cut points named /cut1../cutk like Stata; the Intercept is dropped because cuts identify location"
  verified_by: lead
  date: 2026-10-22
  notes: "Robust VCE is not implemented for ordered models and raises rather than approximating."

- command: tobit
  level: E1
  tolerance: 1.0e-10
  sources:
    - type: invariant
      ref: "Log-likelihood matches an independent implementation of the [R] tobit formula at 1e-12"
    - type: statsmodels_reference
      ref: "Recovers a known DGP (slopes within 0.08, sigma within 0.06); the Tobit slope exceeds the censored-data OLS slope"
  verified_by: lead
  date: 2026-10-22
  notes: "E2 blocked: gpa.dta appears in [R] tobit Example 1 but the Stata Press server would not serve it. Self-implemented, so this is the highest-risk estimator in the package."

- command: predict
  level: E1
  tolerance: 1.0e-12
  sources:
    - type: invariant
      ref: "For OLS, predict(kind='xb') equals fittedvalues exactly; for logit it equals the logistic transform of xb; for poisson it equals exp(xb)"
    - type: published_output
      ref: "Stata predict suboption names (xb, pr, n, e(a,b), ystar(a,b)) per [R] predict"
  verified_by: lead
  date: 2026-10-22
  notes: "Unsupported types raise instead of returning the linear index."

- command: margins
  level: E1
  tolerance: 1.0e-8
  sources:
    - type: published_output
      ref: "Stata margins default is vce(delta) on the response scale (P>|z| for logit/probit, mean scale for poisson)"
    - type: invariant
      ref: "Average marginal effects match the closed form: logit mean(p(1-p)b), probit mean(phi(xb)b), poisson mean(mu)b, OLS the coefficient itself"
  verified_by: lead
  date: 2026-10-22
  notes: "Critical correction: differentiating xb instead of the response gives the coefficient, 4.38x too large for the test logit. dydx/at()/over() supported; contrast/pwcompare/expression raise."

- command: arima
  level: E1
  tolerance: 1.0e-3
  sources:
    - type: statsmodels_reference
      ref: "Recovers a known AR(1) coefficient (0.705 vs true 0.7 at n=1500); AR(1) beats white noise on AIC by >100"
    - type: invariant
      ref: "Reports Wald chi2 for all ARMA coefficients and z inference, like Stata"
  verified_by: lead
  date: 2026-10-22
  notes: "statsmodels ARIMA.fit has no disp= argument; handled."

- command: var
  level: E1
  tolerance: 1.0e-1
  sources:
    - type: statsmodels_reference
      ref: "Recovers a known VAR(1) transition matrix within 0.12"
    - type: invariant
      ref: "select_order returns the full AIC/BIC/HQIC/FPE table (varsoc), not a single chosen lag"
  verified_by: lead
  date: 2026-10-22
  notes: "VAR.params is a bare ndarray; the L1.y1-style index is rebuilt for Stata-style access."

- command: vec / vecrank
  level: E1
  tolerance: 1.0e-1
  sources:
    - type: invariant
      ref: "Johansen trace statistic exceeds the 5% critical value for a known cointegrated pair"
  verified_by: lead
  date: 2026-10-22

- command: arch
  level: E1
  tolerance: 5.0e-2
  sources:
    - type: invariant
      ref: "Recovers GARCH(1,1) persistence alpha+beta near the true 0.96; omega positive"
    - type: statsmodels_reference
      ref: "Conditional volatility is strictly positive; EGARCH/GJR specifications run"
  verified_by: lead
  date: 2026-10-22
  notes: "rescale=False so omega stays on the data's own scale like Stata. arch names parameters alpha[1], not alpha."

- command: dfuller / pperron / kpss
  level: E1
  tolerance: 1.0e-3
  sources:
    - type: invariant
      ref: "ADF fails to reject on a random walk and rejects on an AR(1) with phi=0.3; KPSS has the opposite null and rejects the random walk"
  verified_by: lead
  date: 2026-10-22
  notes: "Uses statsmodels result_object=True to avoid the deprecated tuple API."
