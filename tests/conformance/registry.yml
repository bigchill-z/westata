      ref: "xtunitroot ips y on 30 panels x 12 periods: Stata r(tbar) -2.2259105396588366, r(ttildebar) -1.7875342227529116, r(zt) -3.9114817625880884, r(zttildebar) -3.6087323273920875, r(p_zttildebar) .00015384844272522537; westata matches all five to 1e-12 or better"
    - type: published_output
      ref: "Transliterated from Stata's own ado source, ado/base/_/_xturips.ado and its _ipstab1 table"
  verified_by: lead
  date: 2026-10-23
  notes: "IMPLEMENTED FROM SOURCE, NOT REVERSE ENGINEERED. The earlier note here claimed the fixed-N critical values were an 'irreproducible published table' and that was wrong twice: _xturips.ado is plain readable Stata (21,790 bytes), and the tables it contains are the mean/variance standardisation tables, not critical values. Reading the source gave the algorithm directly -- per-panel ADF t, t-tilde with sd(dy) substituted for rmse, then Z = sqrt(N)(tbar-mu)/sqrt(var) with mu/var linearly interpolated in T. One detail was easy to get backwards and worth recording: Stata writes 'b / (se/rmse) * sd', which evaluates left to right as (b/se)*(rmse/sd). Using the reciprocal gives t-tilde 23% off while t-bar and Z-t-bar stay exact, so the t-bar assertion alone would not have caught it. STILL MISSING: the fixed-N exact critical values (IPS Table 2), which is a large N-by-T grid; requesting them raises UnsupportedError rather than returning a plausible number, because the critical value is exactly what a user reads to decide the test."

- command: xtunitroot llc
  level: E1
  tolerance: 1.0e-1
  sources:
    - type: r_crosscheck
      ref: "xtunitroot llc y on 30x12: Var_ep matches Stata to 1.9e-16; mu_adj -0.554 and sig_adj 0.919 exact; N=300, N_t=12, N_g=30 exact"
    - type: r_crosscheck
      ref: "NOT matching: sbar 0.8287 (Stata 0.8624), td -11.72 (Stata -11.70), tds -12.63 (Stata -5.63)"
  verified_by: lead
  date: 2026-10-23
  notes: "Implemented from _xturllc.ado by transliteration, and PARTIALLY verified. Four things were found and fixed along the way, each by comparing against full-precision r() scalars: (1) LLC's default ADF lag is 1, not 0 as in IPS -- [_xturllc.ado line 32] -- which had shifted N to 330 against Stata's 300; (2) N_t is the RAW period count, not the post-differencing length; (3) the HAC bandwidth int(3.21*T^(1/3)) also counts raw periods, giving the '7.00 lags average' Stata prints; (4) mrssdf divides by capT-p-1 where capT is the raw period count. After those, Var_ep is exact to 1.9e-16 and the adjustment table lookup is exact, which pins the pooled regression and the deterministic specification. STILL UNRESOLVED: sbar, and hence td (1.7e-3) and tds (large). Tested and rejected as explanations: mrssdf denominators of raw-p-1, length, length-1 and capT-p-1, and HAC variance over the post-lag range versus the full differenced range -- none reproduces 0.8624. The correction term in tds is about the size of td itself (N=30, Var_ep=1.15, nu_se=0.052, muadj=-0.554), so a 4% error in sbar moves tds by several units, which is exactly the symptom. The likely culprit is the exact sample Stata's _predict markings leave for wvar, which follows its by-group sample machinery rather than a formula readable from the source. Left at E1 deliberately: the parts that DO match are asserted by tests so they cannot silently regress, and the gap is stated numerically instead of being hidden behind a loose tolerance. This entry replaced a previous note claiming LLC was simply 'not yet transliterated', which was wrong -- it is transliterated and three quarters verified."
- command: xtabond
  level: E2
  tolerance: 2.0e-2
  sources:
