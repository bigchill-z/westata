name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,arch]"

      # PRINT the resolved versions. The nine-day red streak was a version skew that
      # nobody could see: the job log named no version, so "pyfixest 0.70 removed the
      # attribute" had to be rediscovered from a stack trace. One line of output makes
      # the next occurrence a five-second diagnosis.
      - name: Record the resolved dependency versions
        run: |
          python -c "
          import pyfixest, pandas, numpy, arch, statsmodels, linearmodels
          print(f'pyfixest {pyfixest.__version__}')
          print(f'pandas {pandas.__version__}')
          print(f'numpy {numpy.__version__}')
          print(f'arch {arch.__version__}')
          print(f'statsmodels {statsmodels.__version__}')
          print(f'linearmodels {linearmodels.__version__}')
          " | tee versions.txt

      - name: Import check
        run: python -c "import westata; print(westata.__version__)"

      # `-q` alone hides WHICH tests failed: the runner reports "Process completed with exit
      # code 1" and three annotations that name no test, which is why this job stayed red for
      # nine days without a diagnosis. The flags below make a failure self-describing in the log:
      # `-rf` lists failed tests with reasons, `--tb=short` keeps the traceback readable, and the
      # explicit deselects mirror what the local suite skips when Stata is absent.
      - name: Test
        run: |
          python -m pytest -q -rf --tb=short

      # The public-API conventions are ENFORCED as of the 0.3.13 cleanup: every
      # rule in docs/API_CONVENTIONS.md now has zero unfixed findings, so `--strict`
      # passing is a real gate rather than a formality.
      # `tests/test_api_conventions.py` complements this by failing if a rule stops
      # being able to fire at all, and by keeping the document in step.
      - name: Public-API conventions (strict)
        run: python scripts/check_api_conventions.py --strict

      # The step summary is readable through the API without authentication, while the raw job
      # log is not. Writing the failures there makes the next report diagnosable from here.
      - name: Summarise failures
        if: failure()
        run: |
          {
            echo '### Failed tests'
            echo '```'
            python -m pytest -q -rf --tb=no 2>&1 | grep -E '^FAILED|^ERROR' || echo 'no FAILED lines'
            echo '```'
            echo '### Environment'
            echo '```'
            python -V
            python -m pip list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The wheel was once installable-but-unimportable: `pip install` reported success while
      # `import westata` raised ModuleNotFoundError for pyfixest. Nothing in the test suite could see that,
      # because the suite runs against the source tree. Building the wheel and importing IT would have.
      - name: Build and validate the distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --upgrade pip
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "import westata; print('wheel imports:', westata.__version__)"

  # ---------------------------------------------------------------------------
  # The tests above run against the PINNED dependency ranges, so they answer "does
  # the code work with the versions we promise?".  They cannot answer "will the next
  # release of our dependencies break us?" -- and that question is the one that kept
  # CI red for nine days: pyfixest 0.70 shipped, CI resolved it, and a commit that
  # passed locally failed 138 tests in the cloud with no local reproduction.
  #
  # This job deliberately IGNORES the upper bounds, so a breaking upstream release
  # shows up as a RED JOB ON PUSH instead of as an undiagnosable regression later.
  # It is `continue-on-error` because a failure here means "wake up and adapt", not
  # "this commit is broken" -- blocking merges on it would just teach everyone to
  # ignore it.
  # ---------------------------------------------------------------------------
  latest-deps:
    name: test (latest un-pinned dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the upper bounds lifted
        run: |
          python -m pip install --upgrade pip
          # Strip the `,<...` ceilings from a throwaway copy of pyproject.toml, then
          # install from it. Rewriting the real file would be a trap: an accidental
          # commit would silently un-pin the package for every user.
          python - <<'PY'
          import pathlib, re
          source = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          lifted = re.sub(r'(?<=[0-9]),(?:<|<=)[0-9][^"\n]*', '', source)
          pathlib.Path("pyproject-latest.toml").write_text(lifted, encoding="utf-8")
          PY
          cp pyproject-latest.toml pyproject.toml
          python -m pip install -e ".[test,arch]"

      - name: Record the resolved dependency versions
        run: |
          python -c "
          import pyfixest, pandas, numpy, arch, statsmodels, linearmodels
          print(f'pyfixest {pyfixest.__version__}')
          print(f'pandas {pandas.__version__}')
          print(f'numpy {numpy.__version__}')
          print(f'arch {arch.__version__}')
          print(f'statsmodels {statsmodels.__version__}')
          print(f'linearmodels {linearmodels.__version__}')
          "

      - name: Test
        run: python -m pytest -q -rf --tb=short

