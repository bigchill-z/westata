      ref: "xtabond y x1, lags(1) on a 90x9 AR(1) panel: Stata L1.y .4549539, x1 .776234, 30 instruments; westata .454107 / .775963 / 30 instruments"
  verified_by: lead
  date: 2026-10-23
  notes: "One-step GMM per [XT] xtdpd. THE INSTRUMENT COUNT IS THE KEY CHECK: Stata reports 30 for lags(1) on T=9, which is 28 GMM columns plus the differenced covariate and a constant. Three separate bugs were caught by that single number while the estimates still looked plausible: a per-instrument H matrix instead of per-unit, an instrument block starting at y_2 instead of y_1 (same column count, wrong content), and the missing standard instruments (x1 came out 0.878 instead of 0.776). Sargan/Hansen/AR(1)/AR(2) are deliberately NOT reported: the manual does not fully specify their construction, and an approximate number under Stata's name would look more authoritative than its absence."


# --- P10: multi-equation and system estimation -----------------------------

- command: sureg
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "sureg (y1 x1 x2) (y2 x2 x3) on 400 observations with correlated errors: Stata coefficients 1.00723 / 1.960029 / -.6210211 and -.4903816 / .9412217 / .8024322, SEs .0492993/.040549/.0476005 and .0487194/.047139/.039197"
  verified_by: lead
  date: 2026-10-23
  notes: "Feasible GLS, Sigma_ij = e_i'e_j/n (divide by n, not n-k), Omega = Sigma^-1 (x) I, beta = (X'Omega X)^-1 X'Omega y. Coefficients AND standard errors reproduce Stata digit for digit, and the full 6x6 V matches Stata's e(V) at rtol 1e-10 -- verified against live Stata, not only the fixture. The standard errors are the meaningful check: a wrong Sigma leaves every coefficient untouched while moving every SE, and the fitted cross-equation correlation here is 0.5544. The solver uses exact solve/inv rather than pinv, so a singular system fails instead of silently returning something. iterate=True (Stata's isure) raises UnsupportedError. e() uses Stata's positional spellings (r2_1, rmse_1, chi2_1) with label-based aliases."

- command: mvreg
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "mvreg y1 y2 = x1 x2 x3: Stata y1 x1 1.95372, x2 -.6277454, x3 -.0732678; y2 x2 .9381316"
  verified_by: lead
  date: 2026-10-23
  notes: "Every equation shares one design, so the coefficients are per-equation OLS. mvreg and sureg give DIFFERENT coefficients on the same data because mvreg puts every regressor in every equation -- a specification difference, not an inconsistency, and a test asserts it explicitly. One correction to the original brief: the VCE does not differ from per-equation OLS on its DIAGONAL. Stata reports identical standard errors (.04886691 both ways), and the difference lives entirely in the off-diagonal blocks, e.g. V[0,4] = 0.0013157 = 0.556 * sqrt(V00*V44). An earlier test asserted a standard-error difference that does not exist; it now asserts the cross-blocks and the correlation identity instead."

- command: eivreg
  level: E3
  tolerance: 1.0e-7
  sources:
    - type: r_crosscheck
      ref: "eivreg y x1 x2, reliab(x1 .7) on 500 observations, cross-checked against live e(b)/e(V) in StataNow 19.5: x1 2.073214, x2 -.4678675, _cons .8649387; westata coefficients gap 4.2e-8, full V rtol 1e-9"
  verified_by: lead
  date: 2026-10-23
  notes: "[R] eivreg: b = A^-1 X'y with A = X'X/n - S and S = diag((1-r_j) s_j^2). The route there had four wrong turns worth keeping: weighting by 1/lambda gave x1 = 1.214, weighting by lambda gave 1.735, raw X'X instead of X'X/n gave 1.452, and the final 1.8e-3 residual was a ddof choice -- Stata uses ddof=0, not ddof=1. That last gap had been recorded here as an unavoidable variance convention; it was a fixable mistake, and recording it as unavoidable was the worst of the four because it tells a future reader to stop looking. e(r2) = 0.863984 (Stata 0.8640), e(rmse) = 0.835714 (0.8357) and e(F) = 407.779 are all now present and exact; earlier they were 0.511, 0.8335 and missing. reliab=1.0 still reproduces OLS exactly."

- command: manova
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "manova y1 y2 = g on 240 observations, 3 groups: Stata Wilks' lambda .4290, F(4, 472) 62.15; westata lambda 0.4290353821, F 62.15049200"
  verified_by: lead
  date: 2026-10-23
  notes: "Rao's F is an approximation by definition -- an exact F via Wilks' lambda exists only for small numbers of responses and groups -- and Stata itself flags which case applies, a flag reproduced here. My first implementation used a different parameterisation of the Rao transform and produced F = 30.68 against Stata's 62.15, i.e. it was off by a factor of two while Wilks' lambda looked right. Verified now across eight designs (p = 1..4, 2-5 groups), including the exact-versus-approximate flag. Only Wilks' lambda is implemented; the other three statistics are absent rather than approximated, and multiple factors raise UnsupportedError."

- command: nl
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "nl (y = {b0} * exp(-{b1} * x)) on 300 observations: Stata /b0 4.943526 (se .0381662), /b1 .7912568 (se .0080793)"
  verified_by: lead
  date: 2026-10-23
  notes: "Coefficients AND standard errors reproduce Stata to the printed digit. The expression is compiled through an ast whitelist -- there is no eval anywhere -- so a formula like {b0}*__import__('os').system(...) is rejected at validation rather than executed. Parameters are reported with Stata's leading slash. A linear model written as {b0} + {b1}*x reproduces OLS to 1e-5."

- command: frontier
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "frontier y x1 x2 on 400 observations: Stata x1 .7813064, x2 .517943, _cons 1.047813"
  verified_by: lead
  date: 2026-10-23
  notes: "Normal/half-normal stochastic frontier, lnf = ln2 - ln(sigma) + ln(phi(z)) + ln(Phi(-z*lambda)). The tail term uses log_ndtr: computing ln(Phi(z)) directly underflows to -inf for z < -7, which would silently make the likelihood infinite. sigma_u/sigma_v/lambda/gamma are reported in e(). Only distribution(halfnormal) is in scope; truncated and exponential raise UnsupportedError."


# --- P11: causal inference ------------------------------------------------

- command: teffects ra
  level: E3
  tolerance: 1.0e-4
  sources:
    - type: r_crosscheck
      ref: "teffects ra (y x1 x2) (treated) on 1200 confounded observations: Stata ATE 2.034515 (se .0610149), POmean(0) .9785032 (se .0619697); westata 2.03451514 / .06101488 / .97850324 / .06196974"
    - type: r_crosscheck
      ref: "teffects ra ..., atet: Stata ATET 2.04958 (se .06474), POmean(0) 1.48981 (se .0771474); westata 2.04958010 / .06473996 / 1.48980965 / .07714740"
  verified_by: lead
  date: 2026-10-23
  notes: "ate, atet and both potential-outcome means reproduce Stata to every printed digit, standard errors included (largest residual 6e-7). Getting the standard error right took two wrong attempts and the reason is instructive: OLS residuals are orthogonal to the design, so the model-error terms vanish identically and an influence function built only from them collapses to the plug-in variation, 0.0018 -- 33x too small. The variance is dominated by the arm-coefficient term, psi = (yhat1-yhat0 - ATE) + (u1 - u0)'xbar with u_t = (X_t'X_t/n)^-1 x_i t_i e_i. Verified independently against a numerical-differentiation M-estimator engine."

- command: teffects ipw
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "teffects ipw (y) (treated x1 x2): Stata ATE 1.888171 (se .0939242), POmean(0) 1.018208 (se .1001317); westata 1.88817061 / .09392416 / 1.01820803 / .10013166"
  verified_by: lead
  date: 2026-10-23
  notes: "Point estimate AND standard error reproduce every printed digit. The propensity-score estimation error IS propagated: the estimator is written as an M-estimator over (beta, mu1, mu0) with Hajek ratios, so psi = -A^-1 m feeds the propensity Jacobian into the weighting variance. Two wrong versions went before it and both are instructive: treating the propensity as fixed gives 0.1216 against Stata's 0.1001 (21% high), and a naive arm-variance formula gave 0.1632 (74% high). Normalisation is Stata's 1/n, not ddof=1 -- ddof=1 shifts every SE by sqrt((n-1)/n) and breaks conformance."

- command: teffects aipw
  level: E3
  tolerance: 1.0e-6
  sources:
    - type: r_crosscheck
      ref: "teffects aipw (y x1 x2) (treated x1 x2): Stata ATE 2.018836 (se .0625084), POmean(0) .9801461 (se .0615501); westata 2.01883606 / .06250844 / .98014607 / .06155009"
  verified_by: lead
  date: 2026-10-23
  notes: "Every quantity matches to its printed digit. The influence function carries the outcome-model coefficients (b1, b0) AND the propensity Jacobian; omitting the coefficient terms gives 0.0641 against Stata's 0.0625, which is how the earlier draft fell 2.6% short."

- command: teffects nnmatch
  level: E2
  tolerance: 3.0e-2
  sources:
    - type: r_crosscheck
      ref: "teffects nnmatch (y x1 x2) (treated), nneighbor(1): Stata ATE 2.051839 (se .0691114)"
  verified_by: lead
  date: 2026-10-23
  notes: "The POINT estimate is exact (2.05183948 vs 2.051839) with Mahalanobis-style standardisation and exact reuse counts. The standard error is +2.2% (.0706220 vs .0691114) and stays approximate: the gap is entirely in sigma^2(X_i), roughly fifteen variance estimators were tried and bracket 0.0691-0.0706 without singling one out, and Stata's exact form for that term is not documented to the digit. The result labels itself se_method='Abadie-Imbens approximation' so the approximation is machine-checkable rather than buried in prose. A 120-replicate Monte Carlo puts the true sampling SD near 0.0765, which supports Stata's magnitude."

- command: didregress
  level: E3
  tolerance: 1.0e-5
  sources:
    - type: r_crosscheck
      ref: "didregress (y x1) (treated), group(unit) time(period) on 1600 observations: Stata ATET 1.18613 (se .0590465); westata 1.186129621 / .059046515"
  verified_by: lead
  date: 2026-10-23
  notes: "Both the ATET and the standard error reproduce Stata to 1e-8. Two-way fixed effects are absorbed, not dummy-expanded. An earlier version of this entry claimed the standard error was 6.7% low and called it a Stata convention; that was wrong twice over -- the gap came from the ATET-only implementation it measured, and the real convention is the degrees-of-freedom one recorded under xtdidregress."

- command: xtdidregress
  level: E3
  tolerance: 1.0e-5
  sources:
    - type: r_crosscheck
      ref: "xtdidregress (y x1) (treated), group(unit) time(period): Stata ATET 1.18613 (se .055228); westata 1.186129621 / .055227994"
  verified_by: lead
  date: 2026-10-23
  notes: "THE TWO SPELLINGS DO NOT SHARE A STANDARD ERROR, and Stata says so by labelling one 'Repeated cross-sectional' and the other 'Longitudinal'. Same ATET, different variance: .0590465 vs .055228. The cause is a degrees-of-freedom convention. In the repeated cross-section the unit effects behave as ordinary regressors, so K = 1 constant + 1 treatment + 1 covariate + 199 unit + 7 period = 209 and N-K = 1391. In the longitudinal case the unit effect is nested in the cluster variable, so only the period effects count: K = 10, N-K = 1590. The variance ratio is sqrt(1391/1590) = 0.935330298501870 against a measured .055228/.0590465 = 0.935330629. Both numbers are now reproduced to 1e-8, and a test pins the closed-form ratio rather than merely asserting that they differ."

# --- Note on the nl / frontier defects found after P10 shipped -------------
#
# Two P10 numbers were wrong in a way the coefficient comparison could not catch:
#
#   nl's Total sum of squares was centred. Stata centres only when a parameter
#   enters additively, and {b0}*exp(...) has none, so Stata reports the UNCENTRED
#   sum(y^2) = 1017.4143. The centred value is 406.7919, which produced R2 .9914
#   instead of Stata's .9932 -- same fitted model, wrong reported statistics.
#
#   frontier omitted /lnsig2v and /lnsig2u, the two rows that carry the
#   variance-component inference, and had neither the Wald chi2 (4462.60) nor the
#   boundary LR test (chibar2(01) = 23.60).
#
# Both are now exact. frontier's lambda STANDARD ERROR is still not reported: a
# delta-method value gives 0.388 against Stata's .0478678, the fixture does not
# identify which scale Stata uses, and printing a number 8x off would be worse
# than omitting it.


# --- P12: complex survey design -------------------------------------------

- command: "svyset / svy: mean"
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "svyset psu [pw=w], strata(stratum) singleunit(certainty); svy: mean y on 576 observations: Stata b 1.061346613529383, V 0.007628317455187414; westata gap 0 and 8.7e-19"
  verified_by: lead
  date: 2026-10-23
  notes: "Taylor linearisation, psi_i = w_i (y_i - ybar) / sum(w), accumulated as PSU totals within strata with the n_h/(n_h-1) factor. THE WEIGHT IS INSIDE psi: my plan said psi_i = y_i/sum(w) and called it verified, but measurement contradicts that -- it gives V 65% low, w_i y_i/sum(w) gives 30% high, and only w_i (y_i - ybar)/sum(w) reproduces Stata at 3e-16. The plan's claim was wrong because the mean it was checked against used a different centring from the score written down, so the numbers never contradicted each other and the error lived only in the prose. Compared against full-precision e(b)/e(V) rather than the printed six decimals, because survey variance conventions agree on the point estimate and diverge in the fourth decimal of the standard error."

- command: "svy: regress"
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "svy: regress y x1 x2: Stata b [0.811277851322903, -0.3624167886992473, 1.0080429196046916], V 3x3; westata max gap 1.1e-15 on b and 1.8e-15 on V"
  verified_by: lead
  date: 2026-10-23
  notes: "Coefficients are weighted least squares; only the covariance is new. THE SCORE IS THE TRAP: it is psi_i = (X'WX)^-1 w_i x_i e_i, and my first attempt used x_i e_i, which left V 167% wrong while the coefficients stayed exact to 1e-15. Both the weight and the inverse are required. The equivalent sandwich form (X'WX)^-1 [PSU covariance of sum(w x e)] (X'WX)^-1 also matches to 9e-14. Reported order is slopes then _cons, as Stata prints it."

- command: "svy: total"
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "svy: total y: full-precision e(b)/e(V) captured with the other design-A commands"
  verified_by: lead
  date: 2026-10-23
  notes: "psi_i = w_i y_i, NOT w_i (y_i - total). Getting that wrong puts V off by a factor of 2.4e5 while the point estimate stays right, and it went unnoticed because the conformance test asserted only np.isfinite on the variance. It now asserts the full-precision value: b gap 0, V gap 4.4e-16. The point estimate satisfies total = mean * sum(w); the VARIANCES are not related by sum(w)^2, which I asserted first and had to withdraw -- the PSU accumulation and the between-stratum spread do not factor through a constant."

- command: "svy: proportion"
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: r_crosscheck
      ref: "svy: proportion binary: full-precision capture alongside the design-A commands"
  verified_by: lead
  date: 2026-10-23
  notes: "One parameter per level, each treated exactly like a mean after binarisation, which is what svy: proportion is."

- command: "svy: logit"
  level: E3
  tolerance: 1.0e-9
  sources:
    - type: r_crosscheck
      ref: "svy: logit binary x1 x2: Stata b [1.599752259583883, -0.7175541048578664, -0.037837440539974] and V 3x3; westata b gap 4.8e-10, V gap 4.7e-10"
  verified_by: lead
  date: 2026-10-23
  notes: "Weighted maximum likelihood with the linearised score I^-1 w_i x_i (y_i - p_i). The tolerance is 1e-9 rather than 1e-10 because that residual is STATS's stopping tolerance, not ours: evaluating Stata's score at Stata's own published coefficients gives 1.7e-8, while these estimates are the exact maximiser with a gradient of 8e-15. Asserting 1e-10 would have asserted something false about Stata. This command had NO conformance test at all before, and in the version first committed its coefficients were permuted against Stata's x1/x2/_cons order, putting b off by a factor of 18 while the file stayed green."
- command: svyset fpc / singleunit
  level: E3
  tolerance: 1.0e-10
  sources:
    - type: invariant
      ref: "(1 - n_h/N_h) can only shrink a variance; a lone PSU contributes zero under certainty, the average stratum contribution under scaling, and NaN under missing"
  verified_by: lead
  date: 2026-10-23
  notes: "All three singleunit strategies are implemented and they demonstrably differ: certainty skips the lone-PSU stratum, scaling substitutes the mean of the strata that do vary, missing propagates NaN so a user cannot silently get a number where Stata would refuse. df_r = #PSU - #strata is reported in e(df_r); using nobs there instead would make every t statistic look far more precise than it is."


