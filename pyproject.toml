[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "westata"
version = "0.3.48"
description = "Stata-conformant econometrics with a statsmodels-style API"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "patsy>=0.5",
    # Required at import time: `estimators/hdfe.py` imports pyfixest at module level because `reghdfe` is a
    # conformance layer over it, and `estimators/iv.py` imports linearmodels the same way for `ivregress`.
    # Both were missing from this list, and the resulting wheel installed cleanly and then failed on import.
    #
    # UPPER BOUNDS, and why they are here rather than "pip will resolve it":
    # CI installed `pyfixest>=0.30` as 0.70.0 the day 0.70.0 shipped, and 0.70.0 deleted
    # the 0.60 private attributes this package reads (`fit._collin_vars`, `fit._df_t`,
    # `fit._k_fe`, `fit._na_index`, ...). The same commit passed locally on 0.60.0 and
    # failed 138 tests plus 68 setup errors in CI. `estimators/_pyfixest_compat.py` now
    # reads BOTH shapes, so 0.70 is supported -- but an unbounded range means the NEXT
    # breaking release silently turns CI red again with no local reproduction, which is
    # the failure mode these bounds exist to stop. Raise a bound only after the suite has
    # run green against that version (see the `latest-deps` job in .github/workflows/ci.yml,
    # which is where new versions are discovered instead of on push).
    "pyfixest>=0.30,<0.71",
    # UPPER BOUND AT 7.1: linearmodels 7.1 changes the fixed-effects estimate for a
    # balanced-versus-unbalanced entity effect. Measured on ``cao_chen.dta``
    # (20 counties x up to 262 years, `rug_after ~ maize` with entity effects):
    # 7.0 gives maize = 37.43478 (the value Stata's `xtreg, fe` reports) and 7.1
    # gives 108.04224 from the SAME data and the same call into ``PanelOLS``.
    # Calling linearmodels directly reproduces both, so the change is upstream and
    # not in westata's adapter. Since westata's entire purpose is reproducing
    # Stata's numbers, shipping a release whose `xtreg, fe` disagrees with Stata by
    # 3x is not acceptable; the ceiling holds until the upstream behaviour is
    # understood. `tests/test_panel_absorbed_columns.py` pins the Stata value and
    # will fail loudly if the bound is ever lifted without re-verification.
    "linearmodels>=6.0,<7.1",
    # Required by `conformance/registry.py`, which is imported from the package's normal surface.
    "pyyaml>=6",
]

[project.optional-dependencies]
# `matplotlib` is here, not only in `plot`, because the plotting tests RUN in CI.
# It used to arrive transitively via pyfixest -> seaborn, so the version the plot
# tests exercised was whatever seaborn happened to pull -- and matplotlib 3.11
# changed `Gcf.destroy` so a deregistered figure's canvas fell back to
# `FigureCanvasBase` (no `print_png`), which failed `test_plot_no_double_figure`
# on CI while passing locally on 3.10. `westata.plotting.release` now re-attaches a
# real canvas, so both versions work; naming it here keeps the test environment
# deterministic instead of piggy-backing on another package's dependency.
test = ["pytest>=7", "matplotlib>=3.5"]
# `arch` is imported INSIDE functions in `estimators/tseries.py`, so it is only needed for the ARCH/GARCH
# commands. Keeping it optional avoids forcing a large dependency on users who never run those models.
# The bound covers the 9.0 signature change (`model.resids(params)` now takes only the MEAN
# parameters); `estimators/tseries.py::_arch_resids` adapts both, but a future release could
# change it again, so the ceiling keeps a known-good contract.
arch = ["arch>=6.0,<10"]
# IrFTable.plot() imports matplotlib INSIDE the method, so a user who never plots needs nothing.
# Same reasoning as the arch extra above: a large dependency is not forced on everyone.
# The floor is deliberately unbounded at the top: `westata.plotting.release` handles both
# the <=3.10 and the 3.11+ behaviour of `Gcf.destroy` (see its docstring), so a new
# matplotlib minor is a thing to verify, not a thing to exclude.
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
# sdist 需要显式包含这些顶层文件，否则 CHANGELOG 不会被打包
include-package-data = true
