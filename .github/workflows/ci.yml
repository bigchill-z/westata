name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,arch]"

      - name: Import check
        run: python -c "import westata; print(westata.__version__)"

      # `-q` alone hides WHICH tests failed: the runner reports "Process completed with exit
      # code 1" and three annotations that name no test, which is why this job stayed red for
      # nine days without a diagnosis. The flags below make a failure self-describing in the log:
      # `-rf` lists failed tests with reasons, `--tb=short` keeps the traceback readable, and the
      # explicit deselects mirror what the local suite skips when Stata is absent.
      - name: Test
        run: |
          python -m pytest -q -rf --tb=short

      - name: Summarise failures
        if: failure()
        run: |
          echo "=== failed tests ==="
          python -m pytest -q -rf --tb=no 2>&1 | grep -E '^FAILED|^ERROR' || true
          echo "=== environment ==="
          python -V
          python -m pip list

      # The wheel was once installable-but-unimportable: `pip install` reported success while
      # `import westata` raised ModuleNotFoundError for pyfixest. Nothing in the test suite could see that,
      # because the suite runs against the source tree. Building the wheel and importing IT would have.
      - name: Build and validate the distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --upgrade pip
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "import westata; print('wheel imports:', westata.__version__)"
