  verified_by: lead
  date: 2026-10-23
  notes: "The jackknife is the one resampling method with no random numbers, so it is held to an exact standard and it meets that standard on the coefficients (1e-16) and on the mean's variance (3.7e-9). The regression VARIANCE sits 7.4e-6 away and that residual is understood rather than tuned: a single best-fit scaling of 0.9974973603895577 reproduces the whole matrix to 7.7e-9 while (n-1)/n is 0.9975, so the factor is right and the difference lives in the leave-one-out estimates past their sixth digit -- consistent with Stata updating each fit by Sherman-Morrison instead of refitting. Direct refitting is kept deliberately: it is explainable and independently checkable, and guessing at Stata's update formula to win the sixth digit would trade a verifiable implementation for an unverifiable one. e(expected_gap) records this so a future reader does not chase it again. Both the default pseudovalue form and the mse form are implemented; they are different estimators and a test asserts they differ."

- command: bootstrap
  level: E2
  tolerance: 5.0e-1
  sources:
    - type: r_crosscheck
      ref: "bootstrap, reps(200) seed(20261023): regress y x1 x2, and bootstrap r(mean) seed(20261023): summarize y -- captured with the seed recorded"
    - type: invariant
      ref: "the point estimate is independent of the resampling and equals the original fit exactly; a fixed seed reproduces the variance exactly; different seeds give different variances"
  verified_by: lead
  date: 2026-10-23
  notes: "E2 BY CONSTRUCTION, not by shortfall. Bootstrap variances are functions of the random stream, and Stata's generator is not numpy's, so replicate-for-replicate agreement is impossible. What IS verified exactly is everything that does not depend on the stream: the reported point estimate equals the original fit to 1e-12, a fixed seed reproduces the covariance to 1e-12, and distinct seeds produce distinct variances. The variance itself is checked only for magnitude -- the ratio to the analytic OLS standard error must land between 0.5 and 2. Claiming E3 here would require reproducing Stata's RNG, which is neither feasible nor meaningful."

- command: permute
  level: E2
  tolerance: 5.0e-1
  sources:
    - type: r_crosscheck
      ref: "permute with reps(200) seed(20261023) captured"
    - type: invariant
      ref: "a genuinely driving regressor yields a small permuted p-value; the p-value always lies in [0, 1]"
  verified_by: lead
  date: 2026-10-23
  notes: "E2 for the same reason as bootstrap: the p-value is a statistic over a random permutation stream. Two-sided by absolute value, with the (count+1)/(reps+1) convention so a p-value of exactly zero is impossible. A non-regressor raises ConsistencyError rather than permuting something that is not in the model."

- command: bootstrap / permute scope limits
  level: E1
  tolerance: 1.0e-1
  sources:
    - type: invariant
      ref: "estimators other than regress and mean raise UnsupportedError naming the reason"
  verified_by: lead
  date: 2026-10-23
  notes: "Stata's bootstrap accepts arbitrary r() statistics, e.g. 'bootstrap r(mean): summarize y' or any expression over stored results. Supporting that is equivalent to writing a small expression interpreter, so only regression coefficients and means are in scope and everything else raises UnsupportedError that says so. Also out of scope: stratified and cluster bootstrap, permute's enumerate option, and bs's full r() extraction."

